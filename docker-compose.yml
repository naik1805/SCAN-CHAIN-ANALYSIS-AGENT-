version: "3.8"

services:
  diagnosis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scan_chain_diagnosis_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
